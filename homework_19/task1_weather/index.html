<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Task 1 Weather</title>
</head>
<body>
    <div id="weather-widget">
        <h2 id="city"></h2>
    
        <p id="date"></p>
    
        <img id="icon" alt="weather icon">
    
        <p id="description"></p>
        <p id="temperature"></p>
        <p id="humidity"></p>
        <p id="pressure"></p>
        <p id="sunset"></p>
    
        <button id="refresh">Refresh</button>
    </div>
    <script src="./main.js"></script>
</body>
</html>
